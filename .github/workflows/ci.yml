name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.8.4"
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.8.4"
          args: "format --check"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # throwaway values: this database lives only for the duration of the job
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "False"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      # fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked
      # fails if a model change has no migration
      - run: uv run python manage.py makemigrations --check --dry-run
      # addopts in pyproject.toml enforces the coverage gate (--cov-fail-under)
      - run: uv run pytest
